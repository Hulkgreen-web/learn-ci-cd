[project]
name = "learn-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.5",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
